name: Release

# A tag vX.Y.Z builds, tests and packages RDPManager with Velopack (MSI installer and portable zip) and uploads
# them to a DRAFT GitHub release, which the owner reviews and publishes (DESIGN: Packaging and releases).
# Run it by hand (Actions > Release > Run workflow) to package a test build: the files are kept as a workflow
# artifact and no release is created or changed.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for the test package (X.Y.Z)'
        required: true
        default: '0.1.1'

permissions:
  contents: write

env:
  # Opt out of Avalonia's anonymous build-time telemetry (Avalonia.BuildServices).
  AVALONIA_TELEMETRY_OPTOUT: '1'
  # Keep in step with the Velopack package version in src/RDPManager.App/RDPManager.App.csproj.
  VPK_VERSION: '1.2.161'

jobs:
  release:
    name: Package and draft release (Windows)
    runs-on: windows-latest

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        shell: pwsh
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          $version = if ('${{ github.event_name }}' -eq 'workflow_dispatch') { $env:INPUT_VERSION.Trim() } else { '${{ github.ref_name }}'.TrimStart('v') }
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { throw "'$version' is not X.Y.Z." }
          "version=$version" >> $env:GITHUB_OUTPUT

      # The release notes are this version's CHANGELOG.md section (see AGENTS.md, Releases); no section, no release.
      - name: Release notes from CHANGELOG.md
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $lines = Get-Content CHANGELOG.md
          $start = [array]::FindIndex([string[]]$lines, [Predicate[string]] { param($l) $l.StartsWith("## [$version](") })
          if ($start -lt 0) { throw "CHANGELOG.md has no '## [$version](...) - YYYY-MM-DD' section." }
          if ($lines[$start] -notmatch ' - \d{4}-\d{2}-\d{2}$') { throw "The CHANGELOG.md heading for $version has no date: $($lines[$start])" }
          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) { if ($lines[$i].StartsWith('## [')) { $end = $i; break } }
          $section = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          if (-not $section) { throw "The CHANGELOG.md section for $version is empty." }
          Set-Content -Path notes.md -Value $section -Encoding utf8
          $footer = (Get-Content .github/release-footer.md -Raw).Trim()
          $changelog = "Full history: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/CHANGELOG.md)"
          Set-Content -Path release-body.md -Value "$section`n`n$footer`n`n$changelog" -Encoding utf8

      - name: Placeholder notes for a test package
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: Set-Content -Path notes.md -Value 'Test package; not a release.' -Encoding utf8

      - name: Build and test
        shell: pwsh
        run: ./build.ps1 -Configuration Release

      - name: Publish (self-contained, win-x64)
        shell: pwsh
        run: dotnet publish src/RDPManager.App/RDPManager.App.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.version }} -o publish

      - name: Install Velopack CLI
        shell: pwsh
        run: dotnet tool install -g vpk --version $env:VPK_VERSION

      # Earlier releases let Velopack build delta updates; there are none before the first release.
      - name: Download previous release
        shell: pwsh
        continue-on-error: true
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      # The installer is the MSI (owner, 2026-11-06): a standard wizard with welcome, MIT licence and conclusion
      # pages and a per-user or per-machine choice. Velopack still builds its one-click Setup.exe (--noInst also drops
      # the MSI, found 2026-11-06), so Setup.exe is left out of the artifact and deleted from the release. The licence is
      # copied to a .txt name because the documented licence formats are .txt, .md and .rtf.
      - name: Package
        shell: pwsh
        run: |
          Copy-Item LICENSE installer/license.txt
          vpk pack --runtime win-x64 --packId RDPManager --packVersion ${{ steps.version.outputs.version }} --packDir publish `
          --mainExe RDPManager.exe --packTitle RDPManager --packAuthors "Matthew McKinnon" --releaseNotes notes.md `
          --icon src/RDPManager.App/Assets/rdpmanager.ico `
          --msi --instLocation Either --instWelcome installer/welcome.md --instLicense installer/license.txt --instConclusion installer/conclusion.md
          if (-not (Get-ChildItem Releases -Filter *.msi)) { throw 'No MSI was produced.' }
          Get-ChildItem Releases | ForEach-Object { "{0}  {1:N0} bytes" -f $_.Name, $_.Length }

      - name: Keep the test package as a workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: RDPManager-${{ steps.version.outputs.version }}-test
          path: |
            Releases
            !Releases/*-Setup.exe
          retention-days: 7

      - name: Upload to a draft GitHub release
        if: github.event_name == 'push'
        shell: pwsh
        run: >
          vpk upload github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
          --releaseName "RDPManager v${{ steps.version.outputs.version }}" --tag ${{ github.ref_name }}

      - name: Set the release text
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json'; 'X-GitHub-Api-Version' = '2022-11-28' }
          $api = 'https://api.github.com/repos/${{ github.repository }}/releases'
          $release = Invoke-RestMethod -Uri "${api}?per_page=30" -Headers $headers | Where-Object { $_.tag_name -eq '${{ github.ref_name }}' } | Select-Object -First 1
          if (-not $release) { throw 'The draft release for ${{ github.ref_name }} was not found.' }
          $body = @{ body = (Get-Content release-body.md -Raw) } | ConvertTo-Json
          Invoke-RestMethod -Method Patch -Uri "$api/$($release.id)" -Headers $headers -Body $body -ContentType 'application/json' | Out-Null
          # The MSI is the only installer (owner, 2026-11-06): remove Velopack's one-click Setup.exe from the release.
          $setups = @($release.assets) | Where-Object { $_.name -like '*-Setup.exe' }
          foreach ($asset in $setups) {
            Invoke-RestMethod -Method Delete -Uri "$api/assets/$($asset.id)" -Headers $headers | Out-Null
            "Removed $($asset.name) from the release."
          }
          "Release text set on $($release.html_url) (draft: $($release.draft))."
